<body>

<h1>yo 👋</h1>

<p>welcome to chilldoge0's site</p>

<h2>💬 Messages</h2>

<input id="username" placeholder="Username">

<textarea id="message" placeholder="Write a message"></textarea>

<button onclick="sendMessage()">Send</button>

<div id="messages"></div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const supabaseUrl =
"https://idwfzwtibvqvfsyzptyu.supabase.co";

const supabaseKey =
"sb_publishable_pRteYwdrBD7jByjgGrzApA_rIb2ZHqe";

const db =
supabase.createClient(supabaseUrl, supabaseKey);


async function sendMessage() {

    let username =
    document.getElementById("username").value.trim();

    let message =
    document.getElementById("message").value.trim();

    if (!username || !message) {
        alert("Enter a username and message!");
        return;
    }

    const { error } = await db
        .from("messages")
        .insert({
            username: username,
            message: message
        });

    if (error) {
        alert("Message could not be sent.");
        console.error(error);
        return;
    }

    document.getElementById("message").value = "";

    loadMessages();
}


async function loadMessages() {

    const { data, error } = await db
        .from("messages")
        .select("*")
        .order("created_at", {
            ascending:false
        });

    if (error) {
        console.error(error);
        return;
    }

    let box =
    document.getElementById("messages");

    box.innerHTML = "";

    data.forEach(function(msg) {

        let messageBox =
        document.createElement("div");

        messageBox.className = "message";

        let name =
        document.createElement("div");

        name.className = "name";
        name.textContent = msg.username;

        let text =
        document.createElement("div");

        text.textContent = msg.message;

        messageBox.appendChild(name);
        messageBox.appendChild(text);

        box.appendChild(messageBox);

    });
}


loadMessages();

</script>

</body>
</html>
